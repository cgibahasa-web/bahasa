# Cloudflare Workers config for the @opennextjs/cloudflare adapter.
# See https://opennext.js.org/cloudflare

name = "bahasa"
main = ".open-next/worker.js"
compatibility_date = "2026-09-19"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Self-reference service binding, required by the OpenNext Cloudflare cache.
# The service name must match `name` above.
# https://opennext.js.org/cloudflare/caching
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "bahasa"

# R2 bucket used for the incremental cache (ISR/data cache).
# Create it before deploying: `wrangler r2 bucket create bahasa-opennext-cache`
# https://opennext.js.org/cloudflare/caching
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "bahasa-opennext-cache"

# Cloudflare Images binding, used for next/image optimization.
# https://opennext.js.org/cloudflare/howtos/image
[images]
binding = "IMAGES"

# Custom Domains — cgibahasa.com was purchased via Cloudflare Registrar and
# its nameservers already point at Cloudflare. These entries make the zone's
# apex and www serve this Worker directly (Cloudflare auto-provisions the
# DNS record + SSL cert on deploy). Needed for PortOne PG review, which
# requires a real domain instead of the *.workers.dev subdomain.
[[routes]]
pattern = "cgibahasa.com"
custom_domain = true

[[routes]]
pattern = "www.cgibahasa.com"
custom_domain = true
